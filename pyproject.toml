[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ridsca"
version = "0.1.0"
description = "Local-first scam evidence triage with Streamlit and open models"
requires-python = ">=3.11,<3.13"
license = "MIT"

[tool.setuptools.packages.find]
include = ["ridsca*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: downloads and runs real open models (opt-in)"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
